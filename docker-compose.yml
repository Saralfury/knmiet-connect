services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knmiet_connect
      POSTGRES_USER: knmiet
      POSTGRES_PASSWORD: knmiet
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knmiet -d knmiet_connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://knmiet_app:${APP_DB_PASSWORD:-knmiet_app}@postgres:5432/knmiet_connect
      MIGRATION_DATABASE_URL: postgresql+asyncpg://knmiet:knmiet@postgres:5432/knmiet_connect
      APP_DB_ROLE: knmiet_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-knmiet_app}
      JWT_SECRET_KEY: change-this-long-random-secret
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      SECURE_COOKIES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 20s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backups:
